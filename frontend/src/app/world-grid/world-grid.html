<div class="grid-scroll">
  <div
    class="grid"
    role="group"
    aria-label="Celulele lumii"
    [style.grid-template-columns]="'repeat(' + columns() + ', minmax(0, 1fr))'"
    [style.width.px]="columns() * 58"
  >
    @for (cell of cells(); track $index) {
      <button
        type="button"
        class="cell"
        [class.selected]="selected()?.row === cell.row && selected()?.col === cell.col"
        [style.background-color]="background(cell.state)"
        [attr.aria-label]="label(cell.state, cell.row, cell.col, cell.agents)"
        [attr.aria-pressed]="selected()?.row === cell.row && selected()?.col === cell.col"
        (click)="cellSelected.emit({ row: cell.row, col: cell.col })"
      >
        <span aria-hidden="true">{{ cellText(cell.state) }}</span>
        @if (cell.agents.length > 0) {
          <span class="agent" [style.background-color]="cell.agentColor" aria-hidden="true">{{
            name(cell.agents[0].state.type_id).slice(0, 1).toUpperCase()
          }}</span>
          @if (cell.agents.length > 1) {
            <span class="agent-count" aria-hidden="true">{{ cell.agents.length }}</span>
          }
        }
      </button>
    }
  </div>
</div>
